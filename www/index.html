<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E6F3FF">
<link rel="icon" href="icons/icon-192.png">
<title>لغتي التفاعلي</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a children's library — a shelf of colourful book covers, then a full-screen picture book (scene on top, the sentence below, a page-turn dock). Five cover colours carry each story through shelf, reader and end page. */
:root{
  --bg:#E6F3FF; --dot:#D2E8FB; --card:#FFFFFF; --sunk:#EEF4FB; --line:#D5E2F0; --ink:#1B2441; --ink2:#46507A; --muted:#7480A6;
  --berry:#FF5D8F; --berry-d:#D63B6E; --teal:#12B3A8; --teal-d:#0B887F; --orange:#FF9F1C; --orange-d:#D97E00; --blue:#4D7CFE; --blue-d:#2F5BD6; --violet:#8B5CF6; --violet-d:#6A3BE0;
  --sun:#FFC83D; --good:#16B67F; --good-soft:#D8F7EA; --bad:#F2546B; --bad-soft:#FFE3E7; --hl:#FFE680; --on:#FFFFFF; --paper-ink:#1B2441;
  --ar:"Baloo Bhaijaan 2","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --en:"Andika","Baloo Bhaijaan 2","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#101A33; --dot:#18244A; --card:#1B2750; --sunk:#16214A; --line:#2B3A6E; --ink:#EEF2FF; --ink2:#C7D0F2; --muted:#94A0CC;
  --sun:#FFD15C; --good:#34D69B; --good-soft:#0F3A2E; --bad:#FF6B80; --bad-soft:#40172A; --hl:#6B5A10}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#101A33; --dot:#18244A; --card:#1B2750; --sunk:#16214A; --line:#2B3A6E; --ink:#EEF2FF; --ink2:#C7D0F2; --muted:#94A0CC;
  --sun:#FFD15C; --good:#34D69B; --good-soft:#0F3A2E; --bad:#FF6B80; --bad-soft:#40172A; --hl:#6B5A10}
.c0{--h:var(--berry);--hd:var(--berry-d)} .c1{--h:var(--teal);--hd:var(--teal-d)} .c2{--h:var(--orange);--hd:var(--orange-d)} .c3{--h:var(--blue);--hd:var(--blue-d)} .c4{--h:var(--violet);--hd:var(--violet-d)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);background-size:26px 26px;color:var(--ink);font-family:var(--ar);font-size:17px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2{margin:0;line-height:1.25;text-wrap:balance;font-weight:800}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.top .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:6px;font-size:22px}
.brand b{color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px 12px 4px 9px;font-weight:800;box-shadow:0 3px 0 var(--line);color:var(--orange-d)}
.chip svg{width:20px;height:20px;color:var(--sun)}
.chip.st{color:var(--violet)}
.wrap{max-width:620px;margin:0 auto;padding-block:6px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{padding:8px 2px 9px;display:grid;justify-items:center;font-size:14px;font-weight:800;color:var(--muted)}
.tab .ti{width:50px;height:34px;border-radius:14px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--violet)}
.tab[aria-current="page"] .ti{background:color-mix(in srgb,var(--violet) 15%,transparent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:18px;font-weight:800;font-size:18px;background:var(--h,var(--violet));color:#fff;box-shadow:0 5px 0 var(--hd,var(--violet-d));transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--hd,var(--violet-d))}
.btn.big{font-size:20px;padding:16px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.sm{width:auto;padding:9px 16px;font-size:15.5px;border-radius:14px}
.btn.ghost.sm{box-shadow:0 4px 0 var(--line)}

/* owl + bubbles */
.owl{display:block;flex:none;overflow:visible}
.owl .wing{transform-origin:50% 20%;animation:flap 2.4s ease-in-out infinite}
.owl .wing.r{animation-delay:-.4s}
.owl.wow{animation:hop .9s ease-in-out infinite}
@keyframes flap{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-14deg)}94%{transform:rotate(8deg)}}
@keyframes hop{50%{transform:translateY(-8px) rotate(-3deg)}}
.bubble{position:relative;background:var(--card);color:var(--ink);border-radius:22px;padding:14px 18px;font-size:19px;font-weight:700;line-height:1.6;box-shadow:0 5px 0 var(--line)}
.bubble b{color:var(--violet)}
.bubble.sm{font-size:16.5px;padding:9px 14px;border-radius:18px}
.hello{display:grid;justify-items:center;gap:12px;text-align:center}
.shelves{display:grid;gap:14px}
.shelfbtn{display:flex;align-items:center;gap:14px;background:var(--h);color:#fff;border-radius:24px;padding:16px;box-shadow:0 6px 0 var(--hd);text-align:start;width:100%}
.shelfbtn .wi{font-size:44px;line-height:1}
.shelfbtn b{display:block;font-size:20px}
.shelfbtn small{display:block;font-size:14px;opacity:.92}
.shelfbtn .go{font-size:22px;font-weight:800}

/* library */
.shelfnav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.shelfnav::-webkit-scrollbar{display:none}
.sn{white-space:nowrap;padding:8px 14px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:15px;color:var(--ink2)}
.sn[aria-pressed="true"]{background:var(--h);color:#fff;box-shadow:0 3px 0 var(--hd)}
.feature{background:var(--card);border-radius:28px;padding:18px;display:grid;gap:14px;box-shadow:0 7px 0 var(--line);position:relative;overflow:hidden}
.feature::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--h)}
.fowl{display:flex;align-items:center;gap:6px;margin-block:-4px -8px}
.fbook{display:flex;gap:14px;align-items:center}
.fcover{width:96px;aspect-ratio:3/4;max-width:100%;border-radius:10px 18px 18px 10px;background:var(--h);box-shadow:inset 8px 0 0 color-mix(in srgb,#000 16%,transparent),0 6px 0 var(--hd);display:grid;place-items:center;flex:none;transform:rotate(-3deg)}
.fcover span{font-size:50px;filter:drop-shadow(0 3px 0 rgb(0 0 0 / .15))}
.feature .k{font-size:14px;font-weight:800;color:var(--h)}
.feature h1{font-size:24px}
.feature .en{color:var(--muted);font-size:16px}
.pbar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--h,var(--violet));transition:width .3s}
.sec{display:grid;gap:12px}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-h h2{font-size:21px;flex:1}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px;padding:16px 10px 10px;border-radius:22px;background:linear-gradient(180deg,transparent calc(100% - 14px),color-mix(in srgb,var(--orange-d) 45%,var(--card)) calc(100% - 14px));}
.book{position:relative;aspect-ratio:3/4.2;max-width:100%;border-radius:8px 16px 16px 8px;background:var(--h);color:#fff;box-shadow:inset 9px 0 0 color-mix(in srgb,#000 16%,transparent),0 5px 0 var(--hd);display:grid;grid-template-rows:1fr auto;justify-items:center;padding:12px 8px 10px 14px;transition:transform .12s}
.book:active{transform:translateY(3px) rotate(-1deg)}
.book .be{font-size:40px;align-self:center;filter:drop-shadow(0 3px 0 rgb(0 0 0 / .15))}
.book .bt{font-size:13px;font-weight:800;line-height:1.35;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .ribbon{position:absolute;top:-8px;inset-inline-start:-6px;background:var(--sun);color:#5A3A00;font-weight:800;font-size:12.5px;border-radius:8px;padding:1px 8px;box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.book .ribbon.prog{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.book .ribbon.new{background:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-d)}
.book.nx{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,85%,100%{transform:none}90%{transform:rotate(-4deg)}95%{transform:rotate(3deg)}}
.book.done{opacity:.92}

/* reader */
.reader{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,color-mix(in srgb,var(--h) 18%,var(--bg)),var(--bg) 55%);overflow-y:auto}
.rin{max-width:620px;margin:0 auto;padding-block:calc(env(safe-area-inset-top,0px) + 10px) 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.rtop{display:flex;align-items:center;gap:10px}
.rtitle{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:42px;height:42px;display:grid;place-items:center;color:var(--muted);border-radius:14px;flex:none;background:var(--card);box-shadow:0 3px 0 var(--line)}
.pagewrap{background:var(--card);border-radius:28px;box-shadow:0 8px 0 var(--line);overflow:hidden;transform-origin:50% 50%}
.pagewrap.flipL{animation:flipL .18s ease-in forwards}
.pagewrap.flipR{animation:flipR .18s ease-in forwards}
@keyframes flipL{to{transform:perspective(900px) rotateY(-28deg) translateX(-30px);opacity:0}}
@keyframes flipR{to{transform:perspective(900px) rotateY(28deg) translateX(30px);opacity:0}}
.scene{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden}
.scene.sky{background:linear-gradient(#8ED3FF,#D7F0FF)} .scene.meadow{background:linear-gradient(#A6E3FF,#E9FAD9)} .scene.sunset{background:linear-gradient(#FFB38A,#FFE3B0)} .scene.sea{background:linear-gradient(#7FD6E8,#C9F3F0)} .scene.night{background:linear-gradient(#2B2F6B,#5B5FA8)}
.scene .ground{position:absolute;inset:auto -5% -12% -5%;height:34%;border-radius:50% 50% 0 0;background:#7ED957}
.scene.sunset .ground{background:#E2A35C} .scene.sea .ground{background:#F2D69B} .scene.night .ground{background:#3E7C4A}
.scene .sun{position:absolute;top:10%;left:8%;width:15%;aspect-ratio:1;border-radius:50%;background:#FFD84D;box-shadow:0 0 0 10px rgb(255 216 77 / .25)}
.scene.night .sun{background:#F4F1C9;box-shadow:0 0 0 10px rgb(244 241 201 / .15)}
.scene .cloud{position:absolute;width:22%;height:9%;border-radius:99px;background:#fff;opacity:.9;animation:drift 10s ease-in-out infinite alternate}
.scene .cloud::before{content:"";position:absolute;width:55%;height:180%;left:18%;bottom:20%;border-radius:50%;background:#fff}
.scene .c1{top:12%;right:12%} .scene .c2{top:26%;right:46%;width:16%;animation-duration:13s}
.scene.night .cloud{opacity:.25}
@keyframes drift{to{transform:translateX(26px)}}
.actor{position:absolute;font-size:clamp(46px,14vw,74px);line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 5px 0 rgb(0 0 0 / .12))}
.actor.boing{animation:boing .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes boing{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}
.peek{position:absolute;bottom:-6px;left:4%;}
.text{padding:16px 18px 14px;display:grid;gap:10px}
.sent{margin:0;font-size:clamp(22px,6vw,28px);line-height:1.65;text-align:left;color:var(--ink)}
.reader.kid .sent{font-size:clamp(25px,7vw,32px)}
.sent .t{border-radius:8px;padding:0 2px;transition:background .1s,color .1s;cursor:pointer}
.sent .t.v{color:var(--h);font-weight:700;border-bottom:3px dotted color-mix(in srgb,var(--h) 55%,transparent)}
.sent .t.on{background:var(--sun);color:#3A2600!important}
.sent .t.read{color:var(--muted)}
.sent .t.v.read{color:color-mix(in srgb,var(--h) 65%,var(--muted))}
.sent .t.tapped{animation:boing .45s}
.tr{margin:0;color:var(--ink2);font-size:17px;line-height:1.85;background:var(--sunk);border-radius:14px;padding:8px 12px}
.tr.hid{color:var(--muted);cursor:pointer;text-align:center}
.pnum{justify-self:center;font-size:13px;color:var(--muted);font-weight:700}
.rdock{position:fixed;inset:auto 0 0 0;z-index:41;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(transparent,var(--bg) 35%)}
.rdock .in{max-width:620px;margin:0 auto;padding-block:20px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;align-items:center;gap:12px}
.rbtn{width:58px;height:58px;border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;color:var(--ink2);position:relative}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.rbtn:disabled{opacity:.35}
.rbtn.small{width:48px;height:48px;border-radius:16px}
.rbtn.small .num{position:absolute;bottom:-4px;right:-6px;font-size:11px;font-weight:800;background:var(--h);color:#fff;border-radius:8px;padding:0 4px}
.rbtn.on{background:var(--h);color:#fff;box-shadow:0 5px 0 var(--hd)}
.rbtn.main{width:80px;height:80px;border-radius:28px;background:var(--h);color:#fff;box-shadow:0 6px 0 var(--hd)}
.rbtn.main svg{width:36px;height:36px}
.wbub{position:fixed;z-index:60;display:flex;gap:10px;align-items:center;max-width:min(320px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px rgb(0 0 0 / .25);animation:popin .2s}
.wbub .e{font-size:34px}
.wbub b{display:block;font-size:19px}
.wbub small{display:block;opacity:.75;font-size:13px}
.wbub .m{display:block;font-size:16px;font-weight:700}
@keyframes popin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* Bubu's question */
.scrim{position:fixed;inset:0;z-index:49;background:rgb(10 14 40 / .45)}
.pop{position:fixed;inset:auto 0 0 0;z-index:50;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgb(0 0 0 / .2);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .25s ease-out;max-height:90vh;overflow-y:auto}
.pop .in{max-width:620px;margin:0 auto;padding-block:16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.qhead{display:flex;align-items:center;gap:8px}
.qhead .bubble{background:var(--sunk);box-shadow:none}
.say{width:84px;height:84px;border-radius:28px;background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d);display:grid;place-items:center}
.say svg{width:40px;height:40px}
.qopts{display:grid;gap:12px}
.qopts.pics{grid-template-columns:repeat(3,minmax(0,1fr))}
.qo{background:var(--card);border-radius:20px;padding:15px;font-size:20px;font-weight:800;box-shadow:0 5px 0 var(--line);border:3px solid var(--line);text-align:center}
.qo.en{font-weight:700;font-size:22px}
.qo.pic{font-size:58px;padding:16px 6px;line-height:1.1}
.qo.ok{border-color:var(--good);background:var(--good-soft);box-shadow:0 5px 0 var(--good)}
.qo.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 5px 0 var(--bad);animation:shake .3s}
.qsent{font-size:22px;line-height:1.7;margin:0;text-align:left;background:var(--sunk);border-radius:16px;padding:12px 14px}
.gap{display:inline-block;min-width:80px;border-bottom:3px dashed var(--violet);text-align:center;color:var(--violet);font-weight:700}
.sline{min-height:70px;background:var(--sunk);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.sline.good{background:var(--good-soft);outline:3px solid var(--good)}
.gbank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.gt{font-family:var(--en);font-weight:700;font-size:20px;padding:9px 14px;border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.gt.on{background:color-mix(in srgb,var(--blue) 14%,var(--card));border-color:var(--blue)}
.gt.used{visibility:hidden}
.qfb{display:flex;align-items:center;gap:10px;border-radius:18px;padding:8px 12px}
.qfb.ok{background:var(--good-soft)} .qfb.no{background:var(--bad-soft)}
.qfb b{font-size:19px}
.qfb.ok b{color:var(--good)} .qfb.no b{color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.flystar{position:fixed;z-index:70;width:36px;height:36px;color:var(--sun);transition:transform .7s cubic-bezier(.5,-.3,.5,1),opacity .7s;pointer-events:none}
.flystar svg{width:36px;height:36px}

/* the end */
.theend{display:grid;gap:14px;justify-items:center;text-align:center;padding-top:14px}
.theend h1{font-size:32px}
.bigstars{display:flex;gap:6px;align-items:end}
.bigstars span{color:var(--line)}
.bigstars svg{width:70px;height:70px}
.bigstars span:nth-child(2) svg{width:88px;height:88px}
.bigstars .on{color:var(--sun);animation:starin .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars .on:nth-child(2){animation-delay:.25s}.bigstars .on:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.newstk{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--sun) 28%,var(--card));border-radius:20px;padding:10px 16px;box-shadow:0 5px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.newstk span{font-size:46px;animation:starin .6s cubic-bezier(.3,1.6,.5,1) both .6s}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.wcard{background:var(--card);border-radius:18px;padding:10px 6px;box-shadow:0 4px 0 var(--line);display:grid;justify-items:center;gap:2px;min-width:0}
.wcard .e{font-size:34px;line-height:1.2}
.wcard b{font-size:16px;overflow-wrap:anywhere}
.wcard small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.wcard.boing{animation:boing .45s}

/* my words */
.flips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;perspective:900px}
.flip{position:relative;aspect-ratio:1;max-width:100%;transform-style:preserve-3d;transition:transform .4s}
.flip.over{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;align-content:center;gap:2px;padding:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;overflow-wrap:anywhere}
.flip .fr{background:var(--card);box-shadow:0 4px 0 var(--line)}

.empty{display:grid;justify-items:center;gap:6px;text-align:center;background:var(--card);border-radius:22px;padding:22px;box-shadow:0 5px 0 var(--line)}

.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{inset-inline-start:25px}
